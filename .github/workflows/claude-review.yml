name: Claude AI Review

# Advisory AI code review using anthropics/claude-code-action@v1.
#
# Auth: the Claude SUBSCRIPTION via claude_code_oauth_token — NOT an API key.
# Generate the token locally with `claude setup-token`, then add it as the
# CLAUDE_CODE_OAUTH_TOKEN repository secret. No Anthropic API key lives in this
# repo, so reviews draw from the subscription quota.

on:
  # Review on open/reopen/ready AND on every push (`synchronize`) so the review
  # re-runs per push and stays current with the PR head.
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  # On-demand re-review by commenting @claude on the PR.
  issue_comment:
    types: [created]

# Cancel an in-flight review for the same PR when a newer trigger arrives.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Fork safety: use `pull_request` (never `pull_request_target`) and only run
    # when the PR head repo is THIS repo, so the subscription token is never
    # exposed to forked PRs. For comment-triggered runs, require an actual PR
    # comment containing @claude from a collaborator-and-above.
    if: >
      ( github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository ) ||
      ( github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) )
    runs-on: ubuntu-latest
    # Reconciled with --max-turns below: a read-heavy review needs wall-clock
    # headroom, otherwise this cap becomes the binding limit and the run is killed
    # before it posts its summary.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # claude-code-action authenticates via OIDC and needs this.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription auth — do NOT add an Anthropic API key here.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # allowedTools is a strict allowlist — anything omitted is DENIED. It must
          # cover BOTH how the reviewer reads the files and how it publishes findings.
          claude_args: |
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            You are reviewing this pull request as an ADVISORY reviewer for
            Stepwise — an open-source Claude Code plugin (a `/stepwise` skill)
            that teaches a dense technical document to a newcomer: 2–3 sections
            per turn, stopping until the user says "continue", accumulating into
            one persistent page. Do NOT approve or block the PR — leave the
            verdict to the human.

            How to publish your review:
            - Use `mcp__github_inline_comment__create_inline_comment` for concrete
              findings on specific changed lines.
            - Use `gh pr comment` for ONE concise top-level summary. ALWAYS post
              it, even if nothing is notable (say so briefly), so the run leaves a
              visible result.

            This repo is a Claude Code skill: markdown prompt files under
            `skills/`, `commands/`, `agents/`, a plugin manifest under
            `.claude-plugin/`, and release tooling. Review for:
            - Skill quality: is SKILL.md clear and unambiguous, and does its flow
              actually produce a progressive, user-paced explanation? Would any
              instruction mislead the agent?
            - The two rules the whole method rests on — never advance before the
              user says continue, and never state anything the source does not
              contain. Flag any change that weakens either.
            - Consistency between SKILL.md, `commands/stepwise.md`, and
              `agents/stepwise.md` — especially the subagent's altered pacing
              rules, which must stay explicitly justified.
            - Trigger quality: the skill's frontmatter `description` is what makes
              it fire. Changes there should keep it specific enough not to hijack
              plain summarization or single-question requests.
            - Open-source hygiene: NO dependency on company-specific or private
              tooling, and no internal names, hosts, ticket keys, or partner data
              anywhere in the repo.
            - Conventions: English-only in code and docs; Conventional Commits;
              plugin.json / package.json versions kept in sync.

            Group findings by severity (Critical / Warning / Suggestion), be
            concise and specific, cite file and line. Don't nitpick style.

            Spend turns economically: fetch the diff once with `gh pr diff` and
            don't re-fetch; leave inline comments only for the most important
            issues; post the single summary comment last so it always lands.
